name: Comprobar motor y cuatro webs

on:
  workflow_dispatch:
  push:
    paths:
      - engine.py
      - update.py
      - tests/**
      - assets/**
      - .github/workflows/comprobar.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python update.py --force
      - name: Comprobar SEO y archivos públicos
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          for site in Path('sites').iterdir():
              config = json.loads((site/'site.json').read_text())
              base = config['base_url']
              for page in (site/'dist').rglob('*.html'):
                  text = page.read_text()
                  assert 'chatgpt.site' not in text
                  assert base in text
                  assert 'ca-pub-7901739911277041' in text
                  if config.get('adsense', {}).get('enabled'):
                      assert config['adsense'].get('google_cmp_ready')
                      assert 'adsbygoogle.js?client=ca-pub-7901739911277041' in text
                      assert '/assets/consent.js' in text
                      assert 'id="privacy-options" hidden' in text
                  else:
                      assert 'adsbygoogle.js' not in text
              ET.parse(site/'dist/sitemap.xml')
              assert 'pub-7901739911277041' in (site/'dist/ads.txt').read_text()
          sports = json.loads(Path('sites/deportes/sports.json').read_text())
          assert len(sports['leagues']) == 7
          print('Cuatro webs, SEO, AdSense y siete ligas comprobados. Esta tarea no publica.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: webs-comprobadas
          path: sites/*/dist/
          retention-days: 2
