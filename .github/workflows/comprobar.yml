name: Comprobar motor y cuatro webs

on:
  workflow_dispatch:
  push:
    paths:
      - engine.py
      - update.py
      - calendar_worker.mjs
      - tests/**
      - assets/**
      - .github/workflows/comprobar.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node tests/calendar_worker.mjs
      - run: node tests/team_worker.mjs
      - run: node tests/sports_data_worker.mjs
      - run: node tests/sports_page.mjs
      - run: node tests/match_worker.mjs
      - run: node tests/match_page.mjs
      - run: node tests/analytics_tag.mjs
      - run: python update.py --force
      - name: Comprobar SEO y archivos públicos
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          for site in Path('sites').iterdir():
              config = json.loads((site/'site.json').read_text())
              base = config['base_url']
              for page in (site/'dist').rglob('*.html'):
                  text = page.read_text()
                  assert 'chatgpt.site' not in text
                  assert base in text
                  assert 'ca-pub-7901739911277041' in text
                  if config.get('analytics', {}).get('enabled'):
                      measurement = config['analytics']['measurement_id']
                      assert text.count('googletagmanager.com/gtag/js?id='+measurement) == 1
                      assert text.index("gtag('consent', 'default'") < text.index('adsbygoogle.js')
                  if config.get('adsense', {}).get('enabled'):
                      assert config['adsense'].get('google_cmp_ready')
                      assert 'adsbygoogle.js?client=ca-pub-7901739911277041' in text
                      assert '/assets/consent.js' in text
                      assert 'id="privacy-options" hidden' in text
                  else:
                      assert 'adsbygoogle.js' not in text
              ET.parse(site/'dist/sitemap.xml')
              assert 'pub-7901739911277041' in (site/'dist/ads.txt').read_text()
          sports = json.loads(Path('sites/deportes/sports.json').read_text())
          assert {'PD','CDR','SA','PL','FL1','DED','PPL','BL1','CL','EL','MLS','MEX','URU','ARG','BRA'} <= set(sports['leagues'])
          assert Path('sites/deportes/dist/_worker.js').is_file()
          assert json.loads(Path('sites/deportes/dist/_routes.json').read_text())['include'] == ['/api/partidos', '/api/equipo', '/api/tabla', '/api/banderas', '/api/partido']
          for route in ('partidos','futbol/copa-del-rey','futbol/champions-league','futbol/europa-league','futbol/selecciones','futbol/mls','futbol/liga-mx','futbol/liga-uruguaya','futbol/liga-argentina','futbol/brasileirao','clasificacion','goleadores'):
              assert Path('sites/deportes/dist',route,'index.html').is_file()
          print('Cuatro webs, SEO, AdSense, quince competiciones de clubes y calendario internacional comprobados. Esta tarea no publica.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: webs-comprobadas
          path: sites/*/dist/
          retention-days: 2
